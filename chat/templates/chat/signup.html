<!DOCTYPE html>
<html>
<head>
    <title>NOVA - Sign Up</title>
</head>
<body>

    <h1>Welcome to NOVA</h1>
    <p>Create your account</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="/login/">Login</a>
    </p>

</body>
</html>
